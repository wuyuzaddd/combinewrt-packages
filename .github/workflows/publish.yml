name: publish

# Publishes a signed apk feed for a successful combinewrt-build "packages" run.
#
# The site tree is version-frozen and lives on the gh-pages branch:
#   /supplement/<base>/<target>/<commit>/  one immutable published index
#   /supplement/<base>/<target>/           live pointer for that base version
#   /staging/<base>/<target>/<commit>/     staged index that was never promoted
#   /x86_64/                               V1 flat channel, kept byte-identical
#
# publish_mode=staging only adds a staging directory, so the live index and its
# packages stay untouched until the same build is re-dispatched with
# publish_mode=live (the staging -> live promotion path).
on:
  repository_dispatch:
    types: [packages-built]
  workflow_dispatch:
    inputs:
      build_run_id:
        description: combinewrt-build "packages" workflow run id
        required: true
        type: string
      publish_mode:
        description: live also updates the live pointer; staging only stages the index
        required: false
        default: live
        type: choice
        options:
          - live
          - staging
      allow_partial:
        description: Publish even if a selected package failed to build
        required: false
        type: boolean
        default: false

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

env:
  LIVE_URL: https://wuyuzaddd.github.io/combinewrt-packages
  TARGET: x86_64

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      BUILD_RUN_ID: ${{ github.event.inputs.build_run_id || github.event.client_payload.build_run_id }}
      PUBLISH_MODE: ${{ github.event.inputs.publish_mode || github.event.client_payload.publish_mode || 'live' }}
      ALLOW_PARTIAL: ${{ github.event.inputs.allow_partial || 'false' }}
      REQUESTED_BASE_VERSION: ${{ github.event.client_payload.base_version || '' }}
      REQUESTED_SOURCE_COMMIT: ${{ github.event.client_payload.source_commit || '' }}
      GH_TOKEN: ${{ secrets.PACKAGES_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - name: Validate build run
        run: |
          set -euo pipefail
          case "$BUILD_RUN_ID" in
            ''|*[!0-9]*) echo "invalid build_run_id: '$BUILD_RUN_ID'" >&2; exit 1 ;;
          esac
          case "$PUBLISH_MODE" in
            live|staging) ;;
            *) echo "invalid publish_mode: '$PUBLISH_MODE'" >&2; exit 1 ;;
          esac
          run_json="$(gh run view "$BUILD_RUN_ID" --repo wuyuzaddd/combinewrt-build \
            --json workflowName,status,conclusion,headBranch,name,displayTitle)"
          echo "$run_json"
          node -e '
            const run = JSON.parse(process.argv[1]);
            if (run.workflowName !== "packages") throw new Error("not a packages workflow run");
            if (run.status !== "completed" || run.conclusion !== "success") {
              throw new Error("build run is not successful: " + run.status + "/" + run.conclusion);
            }
          ' "$run_json"

      - name: Download build artifact
        run: |
          set -euo pipefail
          rm -rf artifact
          gh run download "$BUILD_RUN_ID" --repo wuyuzaddd/combinewrt-build \
            --name packages-build --dir artifact
          test -f artifact/manifest.json
          ls -l artifact artifact/apks | head -30

      - name: Check manifest and derive publish inputs
        run: |
          set -euo pipefail
          node - <<'NODE'
          const fs = require("node:fs");
          const manifest = JSON.parse(fs.readFileSync("artifact/manifest.json", "utf8"));
          if (manifest.buildRunId !== Number(process.env.BUILD_RUN_ID)) {
            throw new Error(`manifest buildRunId ${manifest.buildRunId} != ${process.env.BUILD_RUN_ID}`);
          }
          if (!Array.isArray(manifest.entries) || manifest.entries.length === 0) {
            throw new Error("manifest has no entries");
          }
          const failed = manifest.entries.filter((entry) => entry.status !== "ok");
          if (failed.length > 0) {
            const names = failed.map((entry) => entry.name).join(", ");
            if (process.env.ALLOW_PARTIAL !== "true") {
              console.error(`refusing to publish: failed packages: ${names}`);
              process.exit(1);
            }
            console.warn(`publishing partial feed, failed packages: ${names}`);
          }

          const baseVersion = process.env.REQUESTED_BASE_VERSION || manifest.baseVersion;
          if (!/^[0-9A-Za-z._-]+$/.test(baseVersion)) throw new Error(`invalid base version ${baseVersion}`);
          const ok = manifest.entries.filter((entry) => entry.status === "ok");
          const commits = new Set(ok.map((entry) => entry.sourceCommit).filter(Boolean));
          if (commits.size > 1) throw new Error(`manifest mixes source commits: ${[...commits].join(", ")}`);
          const sourceCommit = process.env.REQUESTED_SOURCE_COMMIT || [...commits][0] || "";
          if (!/^[0-9a-f]{40}$/.test(sourceCommit)) {
            throw new Error(`manifest carries no usable source commit (got '${sourceCommit}')`);
          }
          if (process.env.REQUESTED_SOURCE_COMMIT && [...commits].length > 0 && !commits.has(process.env.REQUESTED_SOURCE_COMMIT)) {
            throw new Error(`requested source commit ${process.env.REQUESTED_SOURCE_COMMIT} was not built`);
          }

          const lines = [`BASE_VERSION=${baseVersion}`, `SOURCE_COMMIT=${sourceCommit}`];
          fs.appendFileSync(process.env.GITHUB_ENV, `${lines.join("\n")}\n`);
          console.log(`publishing ${process.env.PUBLISH_MODE} for ${baseVersion}/${sourceCommit}`);
          NODE

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Generate catalog and package layout
        run: |
          rm -rf gen
          npm run generate -- \
            --manifest artifact/manifest.json \
            --apks artifact/apks \
            --out gen \
            --hide hide.json

      - name: Install apk-tools 3.0.9
        run: |
          set -euo pipefail
          curl -fsSL --retry 3 -o /tmp/apk-tools-static.apk \
            https://dl-cdn.alpinelinux.org/alpine/v3.23/main/x86_64/apk-tools-static-3.0.9-r0.apk
          rm -rf /tmp/apk-tools
          mkdir -p /tmp/apk-tools
          tar -xzf /tmp/apk-tools-static.apk --ignore-zeros -C /tmp/apk-tools
          echo "APK_TOOL=/tmp/apk-tools/sbin/apk.static" >> "$GITHUB_ENV"
          /tmp/apk-tools/sbin/apk.static --version

      - name: Sign index and add feed key
        env:
          FEED_SIGNING_KEY: ${{ secrets.FEED_SIGNING_KEY }}
        run: |
          set -euo pipefail
          [ -n "$FEED_SIGNING_KEY" ] || { echo "FEED_SIGNING_KEY is not set" >&2; exit 1; }
          umask 077
          key="$RUNNER_TEMP/feed-key.pem"
          printf '%s' "$FEED_SIGNING_KEY" > "$key"
          trap 'rm -f "$key"' EXIT
          (
            cd gen/x86_64
            "$APK_TOOL" mkndx --allow-untrusted --sign-key "$key" \
              --description "combinewrt $BASE_VERSION build-$BUILD_RUN_ID $(date -u +%Y-%m-%d)" \
              --output packages.adb ./*.apk
          )
          rm -f "$key"
          trap - EXIT
          mkdir -p gen/keys
          cp keys/combinewrt-feed.pub.pem gen/keys/combinewrt-feed.pub.pem
          cp hide.json gen/hide.json
          ls -l gen gen/keys gen/x86_64

      - name: Verify signed index against catalog and files
        run: |
          node scripts/verify-feed.mjs \
            --catalog gen/catalog.json \
            --index gen/x86_64/packages.adb \
            --apk-tool "$APK_TOOL"

      - name: Restore published site state
        run: |
          set -euo pipefail
          if git ls-remote --exit-code --heads origin gh-pages >/dev/null 2>&1; then
            git fetch --depth=1 origin gh-pages
            git worktree add --detach site FETCH_HEAD
            echo "state: restored from gh-pages"
          else
            echo "state: bootstrapping from the live Pages site"
            mkdir -p site
            node scripts/import-live-site.mjs --state site --base-url "$LIVE_URL"
            git -C site init -q -b gh-pages
            git -C site remote add origin "$(git remote get-url origin)" 2>/dev/null || true
          fi

      - name: Lay out version-frozen paths
        run: |
          set -euo pipefail
          node scripts/publish-site.mjs \
            --generated gen \
            --state site \
            --channel "$PUBLISH_MODE" \
            --base-version "$BASE_VERSION" \
            --target "$TARGET" \
            --source-commit "$SOURCE_COMMIT" \
            --keep 20 | tee "$RUNNER_TEMP/publish-site.log"
          grep '^frozen_path=' "$RUNNER_TEMP/publish-site.log" | sed 's/^frozen_path=/FROZEN_PATH=/' >> "$GITHUB_ENV"
          grep '^promoted_from_staging=' "$RUNNER_TEMP/publish-site.log" | sed 's/^promoted_from_staging=/PROMOTED_FROM_STAGING=/' >> "$GITHUB_ENV"

      - name: Write public audit record
        run: |
          node scripts/write-audit.mjs \
            --site site \
            --manifest artifact/manifest.json \
            --hide hide.json \
            --catalog gen/catalog.json \
            --channel "$PUBLISH_MODE" \
            --base-version "$BASE_VERSION" \
            --target "$TARGET" \
            --source-commit "$SOURCE_COMMIT" \
            --frozen-path "$FROZEN_PATH" \
            --promoted-from-staging "$PROMOTED_FROM_STAGING" \
            --key gen/keys/combinewrt-feed.pub.pem

      - name: Summary
        if: always()
        run: |
          set -euo pipefail
          {
            echo "### publish ($PUBLISH_MODE)"
            echo
            echo "- build run: $BUILD_RUN_ID"
            echo "- base version: $BASE_VERSION"
            echo "- source commit: $SOURCE_COMMIT"
            echo "- frozen path: ${FROZEN_PATH:-<none>}"
            echo "- promoted from staging: ${PROMOTED_FROM_STAGING:-false}"
            if [ -n "${FROZEN_PATH:-}" ] && [ -f "site/$FROZEN_PATH/index.json" ]; then cat "site/$FROZEN_PATH/index.json"; fi
            if [ -f "site/publish.json" ]; then
              node -e 'const a=require("./site/publish.json"); console.log(`- live index sha256: ${a.index.sha256}\n- live key fingerprint: ${a.keyFingerprint}\n- live frozen path: ${a.frozenPath}`)'
            fi
            if [ -f "site/staging.json" ]; then
              node -e 'const a=require("./site/staging.json"); console.log(`- staging index sha256: ${a.index.sha256}\n- staging frozen path: ${a.frozenPath}`)'
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Commit published site state
        run: |
          set -euo pipefail
          git -C site config user.name "combinewrt-publish"
          git -C site config user.email "publish@combinewrt.invalid"
          git -C site add -A
          if git -C site diff --cached --quiet; then
            echo "publish: nothing changed"
          else
            git -C site commit -q -m "publish $PUBLISH_MODE $BASE_VERSION/$TARGET build-$BUILD_RUN_ID ($SOURCE_COMMIT)"
          fi
          git -C site push "https://x-access-token:${GH_TOKEN}@github.com/wuyuzaddd/combinewrt-packages.git" HEAD:gh-pages

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
