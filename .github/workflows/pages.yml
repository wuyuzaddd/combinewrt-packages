name: pages-fixture-preview

# Fixture preview only. Production deployments go through publish.yml after a
# successful combinewrt-build "packages" run. This workflow deliberately has no
# push trigger so a merge can never overwrite the live signed feed with fixture
# data.

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type "preview" to deploy fixture data over the live site'
        required: true
        type: string

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    if: inputs.confirm == 'preview'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Render fixture site
        run: npm run fixture -- --out site
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
