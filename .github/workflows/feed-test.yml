name: feed-client-test

# Real apk 3.0.9 client test against a throwaway-signed copy of a build
# artifact: installs all six packages in a throwaway ImmortalWrt 25.12.2
# rootfs, then proves a tampered index, a rogue-signed index and a tampered
# apk are all rejected. Uses no production signing key.

on:
  workflow_dispatch:
    inputs:
      build_run_id:
        description: combinewrt-build "packages" run id (empty = latest successful)
        required: false
        type: string
      bundles_url:
        description: Curated bundles JSON (empty = site repo main)
        required: false
        default: ""
        type: string
      base_version:
        description: ImmortalWrt base version used for the bundle indexes
        required: false
        default: "25.12.2"
        type: string
      target:
        description: Feed target used for the bundle indexes
        required: false
        default: "x86/64"
        type: string

permissions:
  contents: read

concurrency:
  group: feed-client-test
  cancel-in-progress: false

jobs:
  bundles:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      BUNDLES_URL: ${{ inputs.bundles_url || 'https://raw.githubusercontent.com/wuyuzaddd/combinewrt/main/config/extension/bundles.json' }}
      BASE_VERSION: ${{ inputs.base_version || '25.12.2' }}
      TARGET: ${{ inputs.target || 'x86/64' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Download apk-tools 3.0.9
        run: |
          set -euo pipefail
          curl -fsSL --retry 3 -o "$RUNNER_TEMP/apk-tools.apk" \
            https://dl-cdn.alpinelinux.org/alpine/v3.23/main/x86_64/apk-tools-static-3.0.9-r0.apk
          mkdir -p "$RUNNER_TEMP/apkstatic"
          tar -xzf "$RUNNER_TEMP/apk-tools.apk" -C "$RUNNER_TEMP/apkstatic" --ignore-zeros
          "$RUNNER_TEMP/apkstatic/sbin/apk.static" --version

      - name: Real bundle dependency/installability closure
        run: |
          set -euo pipefail
          npx tsx scripts/test-bundle-installability.ts \
            --bundles "$BUNDLES_URL" \
            --base-version "$BASE_VERSION" \
            --target "$TARGET" \
            --apk-tool "$RUNNER_TEMP/apkstatic/sbin/apk.static" \
            --work-dir "$RUNNER_TEMP/bundle-installability" \
            --out bundle-installability.json

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bundle-installability
          path: bundle-installability.json
          if-no-files-found: warn
          retention-days: 7

  install:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GH_TOKEN: ${{ secrets.PACKAGES_TOKEN }}
      INPUT_RUN_ID: ${{ inputs.build_run_id }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Resolve build run
        run: |
          set -euo pipefail
          run_id="$INPUT_RUN_ID"
          if [ -z "$run_id" ]; then
            run_id="$(gh run list --repo wuyuzaddd/combinewrt-build \
              --workflow packages --status success --limit 1 \
              --json databaseId --jq '.[0].databaseId // empty')"
          fi
          case "$run_id" in
            ''|*[!0-9]*) echo "no usable build run id" >&2; exit 1 ;;
          esac
          echo "BUILD_RUN_ID=$run_id" >> "$GITHUB_ENV"
          gh run view "$run_id" --repo wuyuzaddd/combinewrt-build \
            --json workflowName,status,conclusion,headBranch

      - name: Download build artifact
        run: |
          set -euo pipefail
          rm -rf artifact
          gh run download "$BUILD_RUN_ID" --repo wuyuzaddd/combinewrt-build \
            --name packages-build --dir artifact
          test -f artifact/manifest.json

      - name: Generate site from artifact
        run: |
          rm -rf site
          npm run generate -- \
            --manifest artifact/manifest.json \
            --apks artifact/apks \
            --out site \
            --hide hide.json

      - name: Run real client install and tamper tests
        run: bash scripts/feed-client-test.sh --site site
